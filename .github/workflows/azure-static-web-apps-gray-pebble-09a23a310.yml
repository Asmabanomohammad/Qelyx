name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies (force devDependencies)
        working-directory: ./frontend
        run: npm install --include=dev

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_PEBBLE_09A23A310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"

          ###### Important: Azure should NOT build. We give it the already built output. ######
          app_location: "./frontend"       # Source path
          api_location: ""                 # No API
          output_location: "./frontend/dist"  # Already built folder
